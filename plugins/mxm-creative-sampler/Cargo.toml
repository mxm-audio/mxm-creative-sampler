[package]
name = "mxm-creative-sampler"
description = "A small-sample sound-design instrument with Repitch, Stretch and Grain playback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
mxm-dsp.workspace = true
mxm-editor.workspace = true
# `vst3` exports the VST3 as well as the CLAP (`nice_export_vst3!`); the bundler makes a `.vst3`
# whenever the library exports one.
nice-plug = { workspace = true, features = ["vst3"] }
mxm-ui.workspace = true
mxm-modulation-params = { workspace = true }
mxm-preset.workspace = true
mxm-params.workspace = true
mxm-telemetry.workspace = true
mxm-tempo.workspace = true
egui.workspace = true
mxm-creative-sampler-dsp.workspace = true
# What a state means: the parameter table, Init, the payload, the import and its arrival, and the
# mapping onto the DSP's parameters, shared with the web tracker. Its import carries MPL-2.0
# symphonia through `mxm-audio-file-decode`, accepted by the owner (2026-09-15); its notice is
# compiled in.
mxm-creative-sampler-state.workspace = true
rfd = "=0.15.4"
serde_json = "=1.0.145"

[dev-dependencies]
# The refusal tests refuse the state crate's reservations one by one. A test-only feature, so the
# bundle carries none of it.
mxm-creative-sampler-state = { workspace = true, features = ["refusal"] }
# The asset tests build payloads by hand.
base64 = "=0.22.1"
# The measurement examples decode files the way an import does.
mxm-audio-file-decode.workspace = true
# The collection's shared headless checks (`crates/mxm-plugin-test`).
mxm-plugin-test.workspace = true
# The tests write the WAVs they import through the collection's encoder. Test-only.
mxm-audio-file.workspace = true
# `wgpu` renders a frame to pixels for the layout-tree review pictures
# (`mxm_plugin_test::tree_checks`, `editor::tests::tree_pictures`). Test-only: nothing here reaches
# the bundle.
egui_kittest = { version = "=0.36.1", features = ["wgpu"] }
image = { version = "=0.25.9", default-features = false, features = ["png"] }
# The modulation standard's checks (`mxm_plugin_test::routing_checks`): the route parameters are
# held to the DSP's own declaration. Test-only features, so the bundle carries neither.
mxm-modulation = { workspace = true, features = ["conformance"] }
mxm-creative-sampler-dsp = { workspace = true, features = ["conformance"] }
