name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Pinned, and moved on purpose: a new stable's lints must not turn a green tree red overnight.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libx11-dev libx11-xcb-dev libxcursor-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Fast tier
        run: cargo test --locked
      - name: Release bundle
        run: cargo xtask bundle mxm-creative-sampler --release
      - name: Host tests (slow tier)
        run: cargo test --locked -p mxm-creative-sampler-host-tests
